[workspace]
resolver = "3"
members = [
  "crates/weftik-hal-core",
  "crates/weftik-runtime-common",
  "crates/weftik-amw-inproc",
  "crates/weftik-hal-flatbuffers",
  "crates/weftik-hal-ir",
  "crates/weftik-modbus-sys",
  "crates/weftik-modbus",
  "crates/weftik-hart",
  "crates/weftik-runtime",
  "crates/weftik-agent",
  "crates/weftik-runtime-client",
  "crates/weftik-hal-binding-gen",
  "crates/weftik-dap-adapter",
  "crates/weftik-il-compiler",
  "crates/weftik-ld-compiler",
  "crates/weftik-ld-layout",
  "crates/weftik-ld-semantics",
  "crates/weftik-sfc-compiler",
  "crates/weftik-fbd-compiler",
  "crates/weftik-gcode-compiler",
  "crates/weftik-cnc-motion",
  "crates/weftik-cnc-axis-group",
  "crates/weftik-amw-zenoh",
  "crates/weftik-theia-bridge",
]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://gitee.com/chengxuewen/weftik"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_crate_dependencies = "warn"
