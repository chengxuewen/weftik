appId: com.weftik.studio
productName: Weftik Studio
artifactName: weftik-studio-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: resources

files:
  - lib/**/*
  - src-gen/**/*
  - resources/**/*
  - package.json
  - "!node_modules/**/*"
  - node_modules/.cache/**/*

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: Weftik Studio ${version}
  artifactName: weftik-studio-${version}-macOS-${arch}.dmg
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file

win:
  target:
    - nsis
  artifactName: weftik-studio-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico

linux:
  target:
    - AppImage
  category: Development
  artifactName: weftik-studio-${version}-linux-${arch}.AppImage
  maintainer: weftik@example.com


electronDownload:
  mirror: https://github.com/electron/electron/releases/download/

electronLanguages:
  - en
  - zh_CN
